name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step is the same command used locally, so a green run here means
      # the same thing as a green terminal.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
